[pipeline]
minimum_score = 0.45
top_n = 3
candidate_pool_size = 10
diversity_penalty = 0.25

[scoring]
freshness_window_hours = 8760.0
relevance_weight = 0.60
freshness_weight = 0.25
popularity_weight = 0.15
relevance_scale = 1.2
noise_terms = ["sponsored"]
noise_penalty = 0.15
title_stopwords = ["weekly digest"]

[scoring.source_weights]
tech_feed = 1.0
community_feed = 0.6

[scoring.keyword_weights]

[[scoring.keyword_groups]]
name = "ai"
terms = ["AI", "LLM"]
term_weight = 0.3
max_score = 0.6

[[scoring.keyword_groups]]
name = "engineering"
terms = ["Python", "reliability"]
term_weight = 0.2
max_score = 0.4

[[scoring.combination_rules]]
name = "ai_engineering"
required_groups = ["ai", "engineering"]
bonus = 0.2
