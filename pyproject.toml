[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linked-ai-content-pipeline"
version = "0.1.0"
description = "Core контентного pipeline: concurrent collection, scoring, deduplication и LLM orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.16,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
linked-pipeline = "linked_ai_content_pipeline.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linked_ai_content_pipeline"]

[tool.pytest.ini_options]
addopts = "-q --cov=linked_ai_content_pipeline --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # Русские пользовательские строки являются намеренными.

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
