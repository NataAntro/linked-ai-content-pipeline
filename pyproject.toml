[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linked-ai-content-pipeline"
version = "0.1.0"
description = "RAG editorial pipeline with explainable scoring, Qdrant retrieval and bounded agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.16,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
linked-pipeline = "linked_ai_content_pipeline.__main__:main"
linked-rag-eval = "linked_ai_content_pipeline.rag_eval:main"
linked-llm-eval = "linked_ai_content_pipeline.llm_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linked_ai_content_pipeline"]

[tool.pytest.ini_options]
addopts = "-q --cov=linked_ai_content_pipeline --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # Русские пользовательские строки являются намеренными.

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
